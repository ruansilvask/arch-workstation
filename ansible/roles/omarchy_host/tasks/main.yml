---
- name: Verify UEFI
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: efi

- name: Require UEFI
  ansible.builtin.fail:
    msg: "Omarchy must be booted in UEFI mode."
  when: not efi.stat.exists

- name: Read root filesystem
  ansible.builtin.command: findmnt -no FSTYPE /
  register: root_fstype
  changed_when: false

- name: Require Btrfs root
  ansible.builtin.fail:
    msg: "Expected Omarchy root filesystem to be Btrfs."
  when: root_fstype.stdout.strip() != "btrfs"

- name: Verify systemd-boot
  ansible.builtin.command: bootctl is-installed
  changed_when: false

- name: Detect AMD GPU
  ansible.builtin.shell: |
    set -o pipefail
    lspci | grep -Ei 'VGA|3D|Display' | grep -Ei 'AMD|ATI|Advanced Micro Devices'
  args:
    executable: /bin/bash
  changed_when: false

- name: Install AMD userspace graphics stack
  community.general.pacman:
    name:
      - mesa
      - lib32-mesa
      - vulkan-radeon
      - lib32-vulkan-radeon
      - vulkan-tools
    state: present
    update_cache: true
